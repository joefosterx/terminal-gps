pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Lets Gradle download the Java 21 toolchain when it is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'tilemap'
include 'core', 'lib', 'viewer-core', 'cli', 'view'

// The Android app needs an SDK; include it only when one is at hand (or asked for), so plain builds stay simple.
def androidSdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
if (providers.gradleProperty('android').isPresent() || androidSdk || file('local.properties').exists()) {
    include 'android'
}
