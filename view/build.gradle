apply plugin: 'application'

application { mainClass = 'dev.tilemap.view.Main' }

dependencies {
    implementation project(':core')
    implementation project(':lib')
    implementation project(':viewer-core')
    implementation libs.jackson.databind   // config.json
    // JLine rather than Lanterna: Lanterna 3.1 has no native Windows console support.
    implementation libs.jline.terminal
    runtimeOnly libs.jline.terminal.jni
}

tasks.register('fatJar', Jar) {
    archiveFileName = 'tilemap-view.jar'
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                   // JLine loads its native console library; JDK 22+ warns without this.
                   'Enable-Native-Access': 'ALL-UNNAMED'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
assemble.dependsOn tasks.named('fatJar')
